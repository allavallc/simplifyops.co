<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — People Whitelist</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body data-page="login">
    <header id="site-header"></header>
    <main class="page-shell">
      <section class="hero card">
        <p class="eyebrow">People whitelist</p>
        <h1>Sign in to manage access</h1>
        <p class="lede">Use Google to sign in. Only approved admins can continue.</p>
        <div id="login-warning" class="notice warning hidden"></div>
        <div class="actions">
          <a class="button primary" href="/auth/login">Sign in with Google</a>
        </div>
        <p class="fine-print">If you already signed in, go to the dashboard.</p>
      </section>
    </main>
    <footer id="site-footer"></footer>
  </body>
</html>
