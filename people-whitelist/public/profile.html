<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Profile — People Whitelist</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body data-page="profile">
    <header id="site-header"></header>
    <main class="page-shell">
      <section class="page-intro card">
        <p class="eyebrow">Profile</p>
        <div class="page-intro-row">
          <div>
            <h1>My profile</h1>
            <p class="lede">Edit your own details and save the changes.</p>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="detail-grid">
          <div class="detail-card">
            <span>Telegram ID</span>
            <strong id="profile-telegram-id">—</strong>
          </div>
          <div class="detail-card">
            <span>Telegram username</span>
            <strong id="profile-telegram-username">—</strong>
          </div>
          <div class="detail-card">
            <span>Last Telegram seen</span>
            <strong id="profile-telegram-last-seen">—</strong>
          </div>
        </div>
      </section>

      <section class="card">
        <form id="profile-form" class="form-grid">
          <label>
            <span>Name</span>
            <input name="person_name" autocomplete="name" required />
          </label>
          <label>
            <span>Email</span>
            <input name="person_email" type="email" autocomplete="email" readonly />
          </label>
          <label>
            <span>Telegram ID</span>
            <input name="telegram_id" inputmode="numeric" placeholder="Optional Telegram user ID" />
          </label>
          <label>
            <span>Phone country code</span>
            <input name="phone_country_code" inputmode="tel" placeholder="+1" />
          </label>
          <label>
            <span>Phone number</span>
            <input name="phone_number" inputmode="tel" autocomplete="tel" placeholder="5551234567" />
          </label>
          <label class="full-width">
            <span>Notes</span>
            <textarea name="notes" rows="5" placeholder="Optional notes"></textarea>
          </label>
          <div class="actions full-width">
            <button type="submit" class="button primary">Save profile</button>
          </div>
        </form>
      </section>
      <section class="card">
        <p class="eyebrow">Job Search Preferences</p>
        <p class="lede" style="margin-bottom:16px">James uses these to filter Upwork jobs every day.</p>
        <form id="job-prefs-form" class="form-grid">
          <label class="full-width">
            <span>Keywords <span style="font-weight:400;color:#888">(comma-separated)</span></span>
            <input name="keywords" placeholder="AI tools, LLM, automation, n8n, Claude API" />
          </label>
          <label>
            <span>Minimum budget ($)</span>
            <input name="min_budget" type="number" min="0" placeholder="500" />
          </label>
          <label>
            <span>Job type</span>
            <select name="job_type">
              <option value="any">Any</option>
              <option value="fixed">Fixed price</option>
              <option value="hourly">Hourly</option>
            </select>
          </label>
          <label class="toggle-field">
            <span>Remote only</span>
            <input type="checkbox" name="remote_only" value="true" />
          </label>
          <label class="toggle-field">
            <span>No agency jobs</span>
            <input type="checkbox" name="no_agencies" value="true" />
          </label>
          <label class="full-width">
            <span>Extra instructions for James</span>
            <textarea name="extra_instructions" rows="3" placeholder="e.g. Only US-based clients, avoid projects under 1 week, prefer startups"></textarea>
          </label>
          <div class="actions full-width">
            <button type="submit" class="button primary">Save preferences</button>
            <span id="job-prefs-saved" style="display:none;color:#1e7e34;font-size:0.9rem;align-self:center">✓ Saved</span>
          </div>
        </form>
      </section>

      <section class="card">
        <p class="eyebrow">CV / Resume</p>
        <div id="cv-status" style="margin-bottom:16px;color:#888;font-size:0.9rem;">Loading…</div>
        <form id="cv-form" enctype="multipart/form-data">
          <label style="display:block;margin-bottom:12px;">
            <span style="display:block;font-size:0.85rem;font-weight:600;margin-bottom:6px;">Upload CV</span>
            <input type="file" name="cv" accept=".pdf,.doc,.docx,.txt" id="cv-input" />
          </label>
          <div class="actions compact">
            <button type="submit" class="button primary small">Upload</button>
            <a id="cv-download-btn" class="button secondary small" href="/auth/cv/download" style="display:none">Download</a>
            <button type="button" id="cv-delete-btn" class="button secondary small" style="display:none">Remove</button>
          </div>
        </form>
      </section>

    </main>
    <footer id="site-footer"></footer>
  </body>
</html>
