<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Person form — People Whitelist</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body data-page="person-form">
    <header id="site-header"></header>
    <main class="page-shell">
      <section class="page-intro card">
        <p class="eyebrow">People</p>
        <div class="page-intro-row">
          <div>
            <h1 id="person-form-title">Add person</h1>
            <p class="lede" id="person-form-lede">Create a whitelist entry or update an existing one.</p>
          </div>
          <div class="actions compact">
            <a class="button secondary" href="/people">Cancel</a>
          </div>
        </div>
      </section>

      <section class="card">
        <form id="person-form" class="form-grid">
          <label>
            <span>Name</span>
            <input name="person_name" autocomplete="name" required />
          </label>
          <label>
            <span>Email</span>
            <input name="person_email" type="email" autocomplete="email" required />
          </label>
          <label>
            <span>Telegram ID</span>
            <input name="telegram_id" inputmode="numeric" placeholder="Optional Telegram user ID" />
          </label>
          <label>
            <span>Phone country code</span>
            <input name="phone_country_code" inputmode="tel" placeholder="+1" />
          </label>
          <label>
            <span>Phone number</span>
            <input name="phone_number" inputmode="tel" autocomplete="tel" placeholder="5551234567" />
          </label>
          <label>
            <span>Status</span>
            <select name="status">
              <option value="allowed">Allowed</option>
              <option value="blocked">Blocked</option>
            </select>
          </label>
          <label>
            <span>Authority</span>
            <select name="authority">
              <option value="member">Member</option>
              <option value="contact">Contact</option>
              <option value="admin">Admin</option>
              <option value="super_admin">Super admin</option>
            </select>
          </label>
          <label class="toggle-field">
            <input type="checkbox" name="can_converse" />
            <span>Can converse (James may reply)</span>
          </label>
          <label class="toggle-field">
            <input type="checkbox" name="can_influence" />
            <span>Can influence memory</span>
          </label>
          <label class="toggle-field">
            <input type="checkbox" name="admin" />
            <span>Admin access (admin UI)</span>
          </label>
          <label class="full-width">
            <span>Notes</span>
            <textarea name="notes" rows="5" placeholder="Optional notes"></textarea>
          </label>
          <div class="actions full-width">
            <button type="submit" class="button primary">Save person</button>
            <a class="button secondary" href="/people">Back to people</a>
          </div>
        </form>
      </section>
    </main>
    <footer id="site-footer"></footer>
  </body>
</html>
