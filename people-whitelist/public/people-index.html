<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>People — People Whitelist</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body data-page="people-index">
    <header id="site-header"></header>
    <main class="page-shell">
      <section class="page-intro card">
        <p class="eyebrow">People</p>
        <div class="page-intro-row">
          <div>
            <h1>Whitelist index</h1>
            <p class="lede">Search, review, and manage everyone on the list.</p>
          </div>
          <div class="actions compact">
            <a class="button secondary" href="/dashboard">Dashboard</a>
            <a class="button primary" href="/people/new">Add person</a>
          </div>
        </div>
      </section>

      <section class="card toolbar">
        <label class="field-inline" for="people-search">
          <span>Search</span>
          <input id="people-search" type="search" placeholder="Name or email" />
        </label>
      </section>

      <section class="card table-card">
        <div id="people-table"></div>
      </section>
    </main>
    <footer id="site-footer"></footer>
  </body>
</html>
