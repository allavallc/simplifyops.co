<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Activity Log — SimplifyOps</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body data-page="activity">
    <header id="site-header"></header>
    <main class="page-shell">
      <section class="page-intro card">
        <p class="eyebrow">James</p>
        <div class="page-intro-row">
          <div>
            <h1>Activity Log</h1>
            <p class="lede">Recent requests processed by James — status, reply, and errors.</p>
          </div>
        </div>
        <div class="filter-row">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="completed">Completed</button>
          <button class="filter-btn" data-filter="processing">Processing</button>
          <button class="filter-btn" data-filter="failed_retryable">Retrying</button>
          <button class="filter-btn" data-filter="failed_needs_review">Needs review</button>
        </div>
      </section>
      <section class="card" id="activity-content">
        <p>Loading…</p>
      </section>
    </main>
    <footer id="site-footer"></footer>
  </body>
</html>
