[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
    ".venv",
    "node_modules",
    "people-whitelist",
    "graphify-out",
    "billing/venv",
    "_site",
]

[tool.ruff.lint]
# Blueprint rule families: E (pycodestyle), F (pyflakes), I (imports), UP (pyupgrade), B (bugbear).
# Documented idiom ignores (deviation from strict E-family — revisit if we adopt a formatter):
#   E501 — long lines are mostly inline SQL / f-strings; wrapping hurts readability here.
#   E701/E702 — the compact `if g := _guard(request): return g` guard one-liners across page routes.
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E701", "E702"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI DI defaults (Depends/Query/...) are call-in-default by design — not real B008.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body",
    "fastapi.Form", "fastapi.File", "fastapi.Header", "fastapi.Cookie", "fastapi.Security",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
