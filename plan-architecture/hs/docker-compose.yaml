services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hana
      POSTGRES_PASSWORD: hana
      POSTGRES_DB: hana_core
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hana -d hana_core"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "5432:5432"
    volumes:
      - hana-pgdata:/var/lib/postgresql/data

  server:
    build: .
    ports:
      - "3100:3100"
    environment:
      DATABASE_URL: postgres://hana:hana@db:5432/hana_core
      PORT: "3100"
      SERVE_UI: "true"
      HANA_DEPLOYMENT_MODE: "authenticated"
      HANA_DEPLOYMENT_EXPOSURE: "private"
      HANA_PUBLIC_URL: "${HANA_PUBLIC_URL:-http://localhost:3100}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
    volumes:
      - hana-data:/hana-core
    depends_on:
      db:
        condition: service_healthy

  hermes:
    build:
      context: .
      dockerfile: Dockerfile.hermes
    environment:
      DATABASE_URL: postgres://hana:hana@db:5432/hana_core
      HANA_SERVER_URL: http://server:3100
    volumes:
      - hana-hermes-data:/data
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_started

volumes:
  hana-pgdata:
  hana-data:
  hana-hermes-data: